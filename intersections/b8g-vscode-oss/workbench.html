<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>B8G Code-OSS — Sovereign Shared-Chromium IDE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: grid;
      grid-template-rows: 36px 1fr 24px;
      overflow: hidden;
    }
    .topbar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-size: 12.5px;
    }
    .brand { color: #58a6ff; font-weight: 700; letter-spacing: 0.3px; }
    .meta { color: #7ee787; font-size: 11.5px; }
    .main {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 0;
    }
    .sidebar {
      background: #0d1117;
      border-right: 1px solid #30363d;
      overflow-y: auto;
      padding: 8px 0;
      font-size: 13px;
    }
    .side-hdr {
      padding: 4px 12px 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
    }
    .item {
      padding: 4px 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #c9d1d9;
    }
    .item:hover { background: #1f2937; }
    .item.active { background: #1f3a5f; color: #fff; }
    .editor-pane {
      display: grid;
      grid-template-rows: 34px 1fr;
      min-height: 0;
    }
    .tabbar {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 12.5px;
      color: #c9d1d9;
    }
    .btn {
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #2ea043; }
    textarea {
      width: 100%;
      height: 100%;
      background: #0b0f14;
      color: #e6edf3;
      border: none;
      outline: none;
      resize: none;
      padding: 14px 18px;
      font-family: 'Cascadia Code', Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.55;
      tab-size: 2;
    }
    .statusbar {
      background: #1f6feb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      font-size: 11.5px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="brand">⚡ B8G Code-OSS — Sovereign Shared-Chromium IDE</span>
    <span class="meta" id="metaBadge">Loading workspace…</span>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="side-hdr">
        <span id="dirTitle">EXPLORER</span>
        <span id="btnUp" style="cursor:pointer;color:#58a6ff;">[..]</span>
      </div>
      <div id="fileList"></div>
    </div>
    <div class="editor-pane">
      <div class="tabbar">
        <span id="activeFile">Welcome — select a file to open</span>
        <button class="btn" id="btnSave">Save (Ctrl+S)</button>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="// Select any file from the Explorer on the left..."></textarea>
    </div>
  </div>
  <div class="statusbar">
    <span id="statusLeft">b8g-electron • 0 MB duplicated Chromium</span>
    <span id="statusRight">Code-OSS v1.148.0 (0.71% Electron coupling)</span>
  </div>

  <script>
    let currentDir = '';
    let currentFile = '';

    async function loadDir(rel) {
      currentDir = rel;
      const entries = await window.b8gIde.listDir(rel);
      document.getElementById('dirTitle').textContent = rel || 'ROOT';
      const list = document.getElementById('fileList');
      list.innerHTML = '';
      for (const e of entries) {
        const div = document.createElement('div');
        div.className = 'item';
        div.textContent = (e.isDir ? '📁 ' : '📄 ') + e.name;
        div.onclick = async () => {
          const next = rel ? `${rel}/${e.name}` : e.name;
          if (e.isDir) {
            await loadDir(next);
          } else {
            await openFile(next, div);
          }
        };
        list.appendChild(div);
      }
    }

    async function openFile(rel, el) {
      for (const x of document.querySelectorAll('.item.active')) x.classList.remove('active');
      if (el) el.classList.add('active');
      const txt = await window.b8gIde.readFile(rel);
      currentFile = rel;
      document.getElementById('activeFile').textContent = rel;
      document.getElementById('editor').value = txt;
      document.getElementById('statusLeft').textContent = `Opened ${rel} (${txt.length} chars)`;
    }

    async function saveFile() {
      if (!currentFile) return;
      const content = document.getElementById('editor').value;
      await window.b8gIde.writeFile(currentFile, content);
      document.getElementById('statusLeft').textContent = `Saved ${currentFile} at ${new Date().toLocaleTimeString()}`;
    }

    document.getElementById('btnSave').onclick = saveFile;
    document.getElementById('btnUp').onclick = () => {
      if (!currentDir) return;
      const parts = currentDir.split('/');
      parts.pop();
      loadDir(parts.join('/'));
    };
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveFile();
      }
    });

    (async () => {
      const info = await window.b8gIde.getWorkspaceInfo();
      document.getElementById('metaBadge').textContent =
        `Workspace: ${info.workspaceRoot} | Code-OSS ${info.vscodeVersion} | 0 MB dup Chromium`;
      await loadDir('');
    })();
  </script>
</body>
</html>
